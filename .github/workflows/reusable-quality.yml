# Reusable quality gate for pnpm + Turborepo repositories.
# Provides the required check "quality / quality" when called from a job with id `quality`.
# Do not add `paths` filters to the caller: a required check must always run.
name: Reusable quality

on:
  workflow_call:
    inputs:
      node-version-file:
        description: File that pins the Node.js version.
        type: string
        default: .nvmrc
      tasks:
        description: Space-separated Turborepo tasks to run.
        type: string
        default: lint typecheck test build
      affected:
        description: Only run tasks for packages affected by the pull request (turbo --affected).
        type: boolean
        default: false
      gitleaks:
        description: Scan the working tree for secrets with gitleaks.
        type: boolean
        default: true

permissions: {}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.affected && '0' || '1' }}

      - name: Scan for secrets
        if: inputs.gitleaks
        run: docker run --rm -v "${PWD}:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --redact --no-banner

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tasks
        env:
          TASKS: ${{ inputs.tasks }}
          AFFECTED: ${{ inputs.affected }}
        run: |
          read -r -a tasks <<<"$TASKS"
          args=()
          if [ "$AFFECTED" = "true" ]; then args+=(--affected); fi
          pnpm exec turbo run "${tasks[@]}" "${args[@]}"
