name: 🐛 Bug report
description: Report a reproducible bug or regression in a Mantine Admin package.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        Questions and feature requests belong in [Discussions](https://github.com/orgs/Mantine-Admin/discussions).
        Please search [existing issues](../issues?q=is%3Aissue) first.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I use the latest version of all `@mantine-admin/*` packages.
          required: true
        - label: I searched existing issues and discussions and found no duplicate.
          required: true
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      options:
        - "@mantine-admin/core"
        - "@mantine-admin/mantine"
        - "@mantine-admin/data-simple-rest"
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      description: The exact version from your lockfile. Don't write "latest".
      placeholder: e.g. 0.3.1
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of the problem.
    validations:
      required: true
  - type: input
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: |
        A link to a runnable minimal example (StackBlitz, CodeSandbox or a GitHub repo).
        Issues that maintainers can't reproduce will be closed.
      placeholder: https://stackblitz.com/...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: I expected ___ but I see ___.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste the output of `npx envinfo --system --browsers --npmPackages "{react,@mantine/*,@tanstack/*,@mantine-admin/*}"`.
      render: shell
    validations:
      required: true
  - type: textarea
    id: possible-fix
    attributes:
      label: Possible fix
      description: Optional. If you have an idea of the cause or the fix.
  - type: checkboxes
    id: self-service
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a pull request to fix this issue.
